name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt clippy
      - run: cargo test --all-targets
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - shell: pwsh
        run: ./scripts/package.ps1
