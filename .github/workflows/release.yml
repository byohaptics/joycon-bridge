name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PUBLICATION_DENYLIST: ${{ vars.PUBLICATION_DENYLIST }}
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: ./scripts/check-publication-policy.ps1
      - shell: pwsh
        run: ./scripts/package.ps1
      - shell: pwsh
        run: gh release create '${{ github.ref_name }}' 'target/release/Joy-Con-Bridge.exe' 'target/release/Joy-Con-Bridge.exe.sha256' --generate-notes --verify-tag
